services:
  - type: web
    name: meal-survey
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_TEMPLATE_NAME
        value: meal_survey
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

# ── CRON-JOB.ORG SETUP (two jobs required for Render free tier) ──────
#
# Render free tier sleeps after 15 min of inactivity.
# When asleep, the first request wakes the server (~30-60s cold start).
# To guarantee the survey cron runs on time, set up TWO jobs:
#
# Job 1 — WAKE SERVER (5 min before survey)
#   URL:    https://your-app.onrender.com/api/health/ping
#   When:   Every day at 09:25 UTC (2:25 PM PKT)
#   Method: GET
#
# Job 2 — SEND SURVEYS
#   URL:    https://your-app.onrender.com/api/cron/daily-survey?secret=YOUR_CRON_SECRET
#   When:   Every day at 09:30 UTC (2:30 PM PKT)
#   Method: GET
#
# The 5-minute gap ensures the server is fully awake when Job 2 fires.
